<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>比の公式ドリル｜内項の積＝外項の積</title>
<style>
:root{--bg:#f7f8fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--ok:#ecfdf5;--ng:#fef2f2;--accent:#111827}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 40px}
.top{position:sticky;top:0;z-index:10;background:rgba(247,248,251,.96);backdrop-filter:blur(8px);padding:10px 0 12px}
.title{font-size:20px;font-weight:800;margin:0 0 5px}.subtitle{font-size:12px;color:var(--muted);margin-bottom:8px}
.progress{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:#111827;width:0;transition:.25s}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-top:7px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:14px;box-shadow:0 5px 20px rgba(0,0,0,.04)}
.rule{font-size:18px;font-weight:900;line-height:1.6;padding:14px 16px;border-radius:14px;background:#f3f4f6;margin-bottom:20px}.rule strong{font-size:22px}
.ratio{text-align:center;font-size:36px;font-weight:800;letter-spacing:.03em;margin:18px 0 10px}.hint{text-align:center;color:var(--muted);font-size:14px;margin-bottom:18px}
.stepTitle{font-size:22px;font-weight:900;line-height:1.45;margin:4px 0 14px}.prompt{font-size:18px;line-height:1.8;margin:8px 0 18px}.choices{display:grid;gap:10px}
button{appearance:none;border:1px solid #d1d5db;background:#fff;color:#111827;border-radius:12px;padding:14px 16px;font-size:17px;font-weight:700;cursor:pointer;transition:.15s}
button:hover{transform:translateY(-1px)}button.primary{background:#111827;color:#fff;border-color:#111827}button:disabled{opacity:.5;cursor:not-allowed;transform:none}
.inputRow{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}input{width:125px;padding:13px 12px;border:2px solid #d1d5db;border-radius:12px;font-size:22px;text-align:center;font-weight:800}
.feedback{display:none;margin-top:16px;padding:14px;border-radius:12px;font-weight:700;line-height:1.7}.feedback.ok{display:block;background:var(--ok)}.feedback.ng{display:block;background:var(--ng)}
.next{display:none;width:100%;margin-top:16px}.eqbox{text-align:center;font-size:25px;font-weight:900;padding:16px;border:2px dashed #d1d5db;border-radius:14px;margin:14px 0 18px;line-height:1.65}
.tag{display:inline-block;border:1px solid #d1d5db;border-radius:999px;padding:3px 9px;font-size:12px;color:#4b5563;margin-bottom:8px}.note{font-size:14px;color:var(--muted);line-height:1.7}.finish{text-align:center}.finish h2{font-size:28px}
.story{background:#fffaf0;border:1px solid #f2dfb7;border-radius:14px;padding:16px;font-size:18px;line-height:1.8;margin:8px 0 18px}.story b{font-size:19px}
.namebox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.namebox div{text-align:center;border:1px solid #e5e7eb;border-radius:12px;padding:12px;background:#fafafa;font-weight:800}
@media(max-width:520px){.card{padding:18px 16px}.ratio{font-size:30px}.rule{font-size:16px}.rule strong{font-size:19px}.stepTitle{font-size:20px}.prompt,.story{font-size:17px}.eqbox{font-size:20px}input{width:110px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 class="title">比の公式ドリル</h1>
    <div class="subtitle">全12問｜もう一度やると数字をランダムに変えます</div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="meta"><span id="progressText">1 / 12 問</span><span id="scoreText">正解 0</span></div>
  </div>
  <main id="app"></main>
</div>
<script>
let problems=[];
let pIndex=0,step=0,score=0,locked=false;
const app=document.getElementById('app');
const bar=document.getElementById('bar');
const progressText=document.getElementById('progressText');
const scoreText=document.getElementById('scoreText');
function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a}
function phrase(){return `<div class="rule">毎回この言葉を読もう<br><strong>「内項の積＝外項の積の公式を利用して」</strong></div>`}
function ratioText(p){return `${p.a} ： ${p.b} ＝ ${p.c} ： ${p.d}`}
function makeBasic(){const pairs=[[2,3],[3,4],[3,5],[4,5],[4,7],[5,6],[5,8],[6,7],[7,9]];const [a,b]=pick(pairs);const k=pick([2,3,4,5]);return {type:'basic',a,b,c:a*k,d:b*k}}
function makeBox(pos){const pairs=[[2,3],[3,4],[3,5],[4,5],[4,7],[5,6],[5,8],[6,7],[7,9]];const [p,q]=pick(pairs);const k=pick([2,3,4,5]);const vals=[p,q,p*k,q*k];const answer=vals[pos];vals[pos]='□';return {type:'box',a:vals[0],b:vals[1],c:vals[2],d:vals[3],answer}}
function makePercent(item){const pctPairs=[[15,25],[20,30],[20,35],[25,40],[30,45],[30,50],[35,50],[40,60],[45,75]];const [kazuPct,hiroPct]=pick(pctPairs);let story='';if(item==='wallet')story=`同じ入場料が、一成の財布の残高の${kazuPct}％、尋子の財布の残高の${hiroPct}％にあたります。財布の残高の比（一成：尋子）は？`;if(item==='bottle')story=`一成のペットボトルの残りの${kazuPct}％は、尋子のペットボトルの残りの${hiroPct}％と同じ量です。ペットボトルの残りの比（一成：尋子）は？`;if(item==='savings')story=`同じ金額が、一成の貯金の${kazuPct}％、尋子の貯金の${hiroPct}％にあたります。貯金額の比（一成：尋子）は？`;return {type:'percent',item,kazuPct,hiroPct,story}}
function makeChange(kind){if(kind==='wallet'){const t=pick([{p:3,q:2,r:5,s:3,factor:2,op:'sub'},{p:4,q:3,r:3,s:2,factor:1,op:'sub'},{p:5,q:4,r:4,s:3,factor:1,op:'sub'}]);return finishChange(kind,t,pick([100,200,300,400,500]),'円')}if(kind==='bottle'){const t=pick([{p:4,q:3,r:3,s:2,factor:1,op:'sub'},{p:5,q:4,r:4,s:3,factor:1,op:'sub'},{p:3,q:2,r:5,s:3,factor:2,op:'sub'}]);return finishChange(kind,t,pick([50,75,100]),'mL')}const t=pick([{p:3,q:2,r:4,s:3,factor:1,op:'add'},{p:2,q:1,r:3,s:2,factor:1,op:'add'},{p:5,q:3,r:3,s:2,factor:1,op:'add'},{p:4,q:3,r:5,s:4,factor:1,op:'add'}]);return finishChange(kind,t,pick([500,1000,1500,2000]),'円')}
function finishChange(kind,t,delta,unit){const base=t.factor*delta,initialK=t.p*base,initialH=t.q*base,sign=t.op==='add'?'+':'−';let action='',noun='';if(kind==='wallet'){noun='財布の残高';action=`ダンに二人がそれぞれ${delta}${unit}あげたところ`}else if(kind==='bottle'){noun='ペットボトルの残り';action=`ダンが二人のペットボトルからそれぞれ${delta}${unit}ずつ飲んだところ`}else{noun='貯金額';action=`ダンが二人にそれぞれ${delta}${unit}ずつくれたところ`}const story=`一成と尋子の${noun}の比は、はじめ ${t.p}：${t.q} でした。${action}、比は ${t.r}：${t.s} になりました。はじめの一成の${noun}はいくらでしたか？`;return {type:'change',kind,...t,delta,unit,base,initialK,initialH,sign,story,noun}}
function generateProblems(){const basics=[makeBasic(),makeBasic(),makeBasic()];const boxPositions=shuffle([0,1,2,3]).slice(0,3);const boxes=boxPositions.map(makeBox);const percents=[makePercent('wallet'),makePercent('bottle'),makePercent('savings')];const changes=[makeChange('wallet'),makeChange('bottle'),makeChange('savings')];problems=[...basics,...boxes,...percents,...changes]}
function updateHeader(){const total=problems.length*4,done=pIndex*4+step;bar.style.width=`${Math.min(100,done/total*100)}%`;progressText.textContent=`${Math.min(pIndex+1,problems.length)} / ${problems.length} 問`;scoreText.textContent=`正解 ${score}`}
function card(content){app.innerHTML=`<section class="card">${content}</section>`;updateHeader()}
function feedback(ok,msg){const f=document.getElementById('feedback');f.className='feedback '+(ok?'ok':'ng');f.innerHTML=msg}
function showNext(){document.getElementById('next').style.display='block'}
function nextStep(){step++;if(step>=4){step=0;pIndex++}render()}
function optionButtons(options,correct){let marked=false;const tagged=options.map(text=>{const isCorrect=!marked&&text===correct;if(isCorrect)marked=true;return {text,isCorrect}});return shuffle(tagged).map(o=>`<button data-correct="${o.isCorrect?'1':'0'}" onclick="answerChoice(this)">${o.text}</button>`).join('')}
function answerChoice(btn){if(locked)return;if(btn.dataset.correct==='1'){locked=true;score++;feedback(true,'正解！<br>もう一度声に出そう：<br><strong>「内項の積＝外項の積の公式を利用して」</strong>');document.querySelectorAll('.choices button').forEach(b=>b.disabled=true);showNext();updateHeader()}else{btn.disabled=true;feedback(false,'ちがいます。<br><strong>「内項の積＝外項の積の公式を利用して」</strong> と言いながら、もう一度考えよう。')}}
function render(){locked=false;if(pIndex>=problems.length){finish();return}const p=problems[pIndex];if(p.type==='percent')return renderPercent(p);if(p.type==='change')return renderChange(p);if(step===0)return renderInner(p);if(step===1)return renderOuter(p);if(step===2)return renderEquation(p);return renderSolve(p)}
function renderInner(p){const correct=`${p.b} × ${p.c}`;const options=[correct,`${p.a} × ${p.d}`,`${p.a} × ${p.c}`];card(`<div class="tag">STEP 1 / 4</div>${phrase()}<div class="ratio">${ratioText(p)}</div><div class="hint">真ん中どうしが「内項」</div><div class="stepTitle">内項の積はどれ？</div><div class="prompt">「内項の積＝外項の積の公式を利用して」、まず内項の2つを見つけよう。</div><div class="choices">${optionButtons(options,correct)}</div><div id="feedback" class="feedback"></div><button id="next" class="next primary" onclick="nextStep()">次のステップへ</button>`)}
function renderOuter(p){const correct=`${p.a} × ${p.d}`;const options=[correct,`${p.b} × ${p.c}`,`${p.b} × ${p.d}`];card(`<div class="tag">STEP 2 / 4</div>${phrase()}<div class="ratio">${ratioText(p)}</div><div class="hint">両はしが「外項」</div><div class="stepTitle">外項の積はどれ？</div><div class="prompt">「内項の積＝外項の積の公式を利用して」、今度は外項の2つを見つけよう。</div><div class="choices">${optionButtons(options,correct)}</div><div id="feedback" class="feedback"></div><button id="next" class="next primary" onclick="nextStep()">次のステップへ</button>`)}
function renderEquation(p){const correct=`${p.b} × ${p.c} ＝ ${p.a} × ${p.d}`;const options=[correct,`${p.a} × ${p.b} ＝ ${p.c} × ${p.d}`,`${p.a} × ${p.c} ＝ ${p.b} × ${p.d}`];card(`<div class="tag">STEP 3 / 4</div>${phrase()}<div class="ratio">${ratioText(p)}</div><div class="stepTitle">公式の形にしよう</div><div class="prompt">「内項の積＝外項の積の公式を利用して」、正しい式を1つ選ぼう。</div><div class="choices">${optionButtons(options,correct)}</div><div id="feedback" class="feedback"></div><button id="next" class="next primary" onclick="nextStep()">次のステップへ</button>`)}
function renderSolve(p){if(p.type==='basic'){const left=Number(p.b)*Number(p.c),right=Number(p.a)*Number(p.d);card(`<div class="tag">STEP 4 / 4</div>${phrase()}<div class="ratio">${ratioText(p)}</div><div class="stepTitle">左右の積が同じか確かめよう</div><div class="prompt">「内項の積＝外項の積の公式を利用して」、内項と外項をそれぞれ計算しよう。</div><div class="eqbox">${p.b} × ${p.c} ＝ ${p.a} × ${p.d}</div><div class="inputRow"><input id="left" inputmode="numeric" placeholder="内項"><span style="font-size:24px;font-weight:900">＝</span><input id="right" inputmode="numeric" placeholder="外項"></div><button class="primary" style="width:100%;margin-top:14px" onclick="checkProducts(${left},${right})">答え合わせ</button><div id="feedback" class="feedback"></div><button id="next" class="next primary" onclick="nextStep()">次の問題へ</button>`)}else{const eq=`${p.b} × ${p.c} ＝ ${p.a} × ${p.d}`;card(`<div class="tag">STEP 4 / 4</div>${phrase()}<div class="ratio">${ratioText(p)}</div><div class="stepTitle">□の値を求めよう</div><div class="prompt">「内項の積＝外項の積の公式を利用して」、この式から□を計算しよう。</div><div class="eqbox">${eq}</div><div class="inputRow"><span style="font-size:22px;font-weight:800">□ ＝</span><input id="xans" inputmode="numeric" placeholder="?"></div><button class="primary" style="width:100%;margin-top:14px" onclick="checkX(${p.answer})">答え合わせ</button><div id="feedback" class="feedback"></div><button id="next" class="next primary" onclick="nextStep()">次の問題へ</button>`)}}
function checkProducts(l,r){if(locked)return;const lv=Number(document.getElementById('left').value),rv=Number(document.getElementById('right').value);if(lv===l&&rv===r){locked=true;score++;feedback(true,`正解！ ${l} ＝ ${r}<br><strong>内項の積＝外項の積</strong> になっています。`);showNext();updateHeader()}else feedback(false,'もう一度計算してみよう。<br>合言葉は <strong>「内項の積＝外項の積の公式を利用して」</strong>。')}
function checkX(ans){if(locked)return;const v=Number(document.getElementById('xans').value);if(v===ans){locked=true;score++;feedback(true,`正解！ □ ＝ ${ans}<br>最後にもう一度：<strong>「内項の積＝外項の積の公式を利用して」</strong>`);showNext();updateHeader()}else feedback(false,'ちがいます。内項の積と外項の積が同じになるように、もう一度計算しよう。')}
function renderPercent(p){const a=p.kazuPct,b=p.hiroPct,g=gcd(a,b),simpleA=b/g,simpleB=a/g;if(step===0){const correct=`一成 × ${a}％ ＝ 尋子 × ${b}％`;const options=[correct,`一成 × ${b}％ ＝ 尋子 × ${a}％`,`一成 ＋ ${a}％ ＝ 尋子 ＋ ${b}％`];return card(`<div class="tag">文章題 STEP 1 / 4</div>${phrase()}<div class="story"><b>問題</b><br>${p.story}</div><div class="stepTitle">まず「同じ量」を式にしよう</div><div class="prompt">一成側と尋子側で、同じになっている量を式にします。</div><div class="choices">${optionButtons(options,correct)}</div><div id="feedback" class="feedback"></div><button id="next" class="next primary" onclick="nextStep()">次のステップへ</button>`)}if(step===1){const correct=`一成 ： 尋子 ＝ ${b} ： ${a}`;const options=[correct,`一成 ： 尋子 ＝ ${a} ： ${b}`,`一成 ： 尋子 ＝ ${a+b} ： 100`];return card(`<div class="tag">文章題 STEP 2 / 4</div>${phrase()}<div class="story">${p.story}</div><div class="eqbox">一成 × ${a}％ ＝ 尋子 × ${b}％</div><div class="stepTitle">比の形に直そう</div><div class="prompt">「内項の積＝外項の積の公式を利用して」、一成：尋子 の比になる式を選ぼう。<br><b>％の数字は反対側に来ます。</b></div><div class="choices">${optionButtons(options,correct)}</div><div id="feedback" class="feedback"></div><button id="next" class="next primary" onclick="nextStep()">次のステップへ</button>`)}if(step===2){const correct=`${b} ： ${a}`;const options=[correct,`${a} ： ${b}`,`${a/g} ： ${b/g}`];return card(`<div class="tag">文章題 STEP 3 / 4</div>${phrase()}<div class="story">${p.story}</div><div class="stepTitle">約分する前の比はどれ？</div><div class="prompt">「内項の積＝外項の積の公式を利用して」、一成：尋子 を数字で表そう。</div><div class="choices">${optionButtons(options,correct)}</div><div id="feedback" class="feedback"></div><button id="next" class="next primary" onclick="nextStep()">次のステップへ</button>`)}card(`<div class="tag">文章題 STEP 4 / 4</div>${phrase()}<div class="story">${p.story}</div><div class="stepTitle">いちばん簡単な整数比にしよう</div><div class="eqbox">${b} ： ${a} → ？ ： ？</div><div class="namebox"><div>一成</div><div>尋子</div></div><div class="inputRow"><input id="pa" inputmode="numeric" placeholder="一成"><span style="font-size:24px;font-weight:900">：</span><input id="pb" inputmode="numeric" placeholder="尋子"></div><button class="primary" style="width:100%;margin-top:14px" onclick="checkPair(${simpleA},${simpleB})">答え合わせ</button><div id="feedback" class="feedback"></div><button id="next" class="next primary" onclick="nextStep()">次の問題へ</button>`)}
function checkPair(a,b){if(locked)return;const av=Number(document.getElementById('pa').value),bv=Number(document.getElementById('pb').value);if(av===a&&bv===b){locked=true;score++;feedback(true,`正解！ <strong>一成：尋子 ＝ ${a}：${b}</strong><br>「内項の積＝外項の積の公式を利用して」求められました。`);showNext();updateHeader()}else feedback(false,'もう一度。％の数字を反対側に置いて、最後に約分しよう。')}
function changeAfterText(p,who){const coef=who==='k'?p.p:p.q;return `${coef}×□ ${p.sign} ${p.delta}`}
function renderChange(p){const afterK=changeAfterText(p,'k'),afterH=changeAfterText(p,'h');if(step===0){const correct=`一成 ＝ ${p.p}×□、尋子 ＝ ${p.q}×□`;const options=[correct,`一成 ＝ ${p.q}×□、尋子 ＝ ${p.p}×□`,`一成 ＝ ${p.p+p.q}×□、尋子 ＝ □`];return card(`<div class="tag">変化する比 STEP 1 / 4</div>${phrase()}<div class="story"><b>問題</b><br>${p.story}</div><div class="stepTitle">はじめの比を□で表そう</div><div class="prompt">はじめが ${p.p}：${p.q} なので、共通する1つ分を□とします。</div><div class="choices">${optionButtons(options,correct)}</div><div id="feedback" class="feedback"></div><button id="next" class="next primary" onclick="nextStep()">次のステップへ</button>`)}if(step===1){const correct=`一成 ＝ ${afterK}、尋子 ＝ ${afterH}`;const wrongSign=p.sign==='+'?'−':'+';const options=[correct,`一成 ＝ ${p.p}×□ ${wrongSign} ${p.delta}、尋子 ＝ ${p.q}×□ ${wrongSign} ${p.delta}`,`一成 ＝ ${p.p}×□、尋子 ＝ ${p.q}×□`];return card(`<div class="tag">変化する比 STEP 2 / 4</div>${phrase()}<div class="story">${p.story}</div><div class="eqbox">はじめ：一成＝${p.p}×□　尋子＝${p.q}×□</div><div class="stepTitle">変化したあとの量を表そう</div><div class="prompt">二人とも同じ ${p.delta}${p.unit} だけ${p.op==='add'?'増え':'減り'}ます。</div><div class="choices">${optionButtons(options,correct)}</div><div id="feedback" class="feedback"></div><button id="next" class="next primary" onclick="nextStep()">次のステップへ</button>`)}if(step===2){const correct=`(${afterH}) × ${p.r} ＝ (${afterK}) × ${p.s}`;const wrong1=`(${afterK}) × ${p.r} ＝ (${afterH}) × ${p.s}`;const wrong2=`(${afterK}) × ${afterH} ＝ ${p.r} × ${p.s}`;return card(`<div class="tag">変化する比 STEP 3 / 4</div>${phrase()}<div class="story">${p.story}</div><div class="eqbox">(${afterK}) ： (${afterH}) ＝ ${p.r} ： ${p.s}</div><div class="stepTitle">内項の積＝外項の積にしよう</div><div class="prompt"><strong>「内項の積＝外項の積の公式を利用して」</strong>、正しい式を選ぼう。</div><div class="choices">${optionButtons([correct,wrong1,wrong2],correct)}</div><div id="feedback" class="feedback"></div><button id="next" class="next primary" onclick="nextStep()">次のステップへ</button>`)}card(`<div class="tag">変化する比 STEP 4 / 4</div>${phrase()}<div class="story">${p.story}</div><div class="eqbox">(${afterH}) × ${p.r} ＝ (${afterK}) × ${p.s}</div><div class="stepTitle">はじめの一成の${p.noun}を求めよう</div><div class="prompt">式を解いて□を求め、最後に <b>${p.p}×□</b> を計算します。</div><div class="inputRow"><input id="changeAns" inputmode="numeric" placeholder="答え"><span style="font-size:18px;font-weight:800">${p.unit}</span></div><button class="primary" style="width:100%;margin-top:14px" onclick="checkChange(${p.initialK},${p.base},${p.initialH},'${p.unit}')">答え合わせ</button><div id="feedback" class="feedback"></div><button id="next" class="next primary" onclick="nextStep()">次の問題へ</button>`)}
function checkChange(ans,base,h,unit){if(locked)return;const v=Number(document.getElementById('changeAns').value);if(v===ans){locked=true;score++;feedback(true,`正解！<br>□ ＝ ${base}${unit}<br>はじめは <strong>一成 ${ans}${unit}、尋子 ${h}${unit}</strong> でした。<br>「内項の積＝外項の積の公式を利用して」解けました。`);showNext();updateHeader()}else feedback(false,'もう一度計算しよう。<br>まず内項の積＝外項の積の式から□を求め、そのあと一成の分を計算します。')}
function finish(){bar.style.width='100%';app.innerHTML=`<section class="card finish"><h2>ドリル完了！</h2><div class="rule">最後に3回読もう<br><strong>「内項の積＝外項の積の公式を利用して」</strong></div><p style="font-size:20px;font-weight:800">正解数：${score} / ${problems.length*4}</p><p class="note">「もう一度やる」を押すと、数字を変えた新しい12問が作られます。</p><button class="primary" style="width:100%" onclick="restart()">数字を変えてもう一度やる</button></section>`}
function restart(){generateProblems();pIndex=0;step=0;score=0;locked=false;render();window.scrollTo({top:0,behavior:'smooth'})}
generateProblems();render();
</script>
